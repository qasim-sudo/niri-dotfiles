# /etc/sddm.conf — SilentSDDM with the KEN theme.
#
# Installed to /etc/sddm.conf by lib/sddm.sh (a `root` deploy: backed up, then
# written with sudo).
#
# NOTE ON THE THEME
# `Current=silent` selects /usr/share/sddm/themes/silent, which comes from the
# AUR package sddm-silent-theme. That theme ships several login layouts and
# picks one in its metadata.desktop. The installer rewrites that file so the
# single active line is:
#
#     ConfigFile=configs/ken.conf
#
# That is what makes the greeter show KEN rather than a different variant.
# Because metadata.desktop is a pacman-owned file, ANY upgrade of
# sddm-silent-theme reverts it — which is why the patch is reapplied on every
# install and re-checked by verify.sh.
#
# See docs/TROUBLESHOOTING.md if the greeter ever comes back in the wrong theme.

[General]
# SilentSDDM. `silent` hides the username and lets you type just the password.
Current=silent

# Wayland session only. niri is a Wayland compositor; starting it under X11
# would be wrong.
SessionDir=/usr/share/wayland-sessions

# Keep the Num Lock state across the greeter.
NumLockEnabled=true

# Stop the display from powering down while the password field has focus.
GreeterPowerMonitor=false

[Theme]
# Provided by bibata-cursor-theme-bin (packages/aur-required.txt), so the
# pointer matches the cursor in the session.
CursorTheme=Bibata-Modern-Classic

# On-screen keyboard for the greeter. Requires the qtvirtualkeyboard package,
# which is in packages/core.txt because these two lines depend on it.
InputMethod=qtvirtualkeyboard
QT_IM_MODULE=qtvirtualkeyboard
