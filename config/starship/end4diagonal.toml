# starship prompt configuration.
#
# Installed to ~/.config/starship/end4diagonal.toml and pointed at by
# STARSHIP_CONFIG in config/fish/config.fish.
#
# Two-line prompt: command duration, then working directory + git branch.
#
# NOTE ON `palette` AND THE BLOCK AT THE BOTTOM
# The prompt refers to `palette = "noctalia"`, and the [palettes.noctalia]
# table is defined at the end of THIS SAME FILE, inside marker comments.
# starship resolves palettes from the active config plus any file in
# ~/.config/starship/, so keeping the table here means the prompt works with no
# other file present. The block between the markers is regenerated by Noctalia
# when the wallpaper-derived palette changes; the values below are only a seed
# so the very first prompt is already coloured correctly.

palette = "noctalia"
add_newline = true
format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:7'

# ---------------------------------------------------------------------------
# Prompt character
# ---------------------------------------------------------------------------
# A Nerd Font glyph, which is why ttf-jetbrains-mono-nerd is a core package.
[character]
success_symbol = " [󰐊](bold fg:2)"
error_symbol = "[✗](bold fg:1)"

# ---------------------------------------------------------------------------
# Hidden modules
# ---------------------------------------------------------------------------
# No nix-style package list in this prompt.
[package]
disabled = true

# ---------------------------------------------------------------------------
# Git
# ---------------------------------------------------------------------------
[git_branch]
style = "bg: 5"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " [](bold fg:5)[$symbol $branch(:$remote_branch)](fg:0 bg:5)[ ](bold fg:5)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold 1)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](2)'
renamed = " ✍️ "
deleted = " 🗑 "

# ---------------------------------------------------------------------------
# Host
# ---------------------------------------------------------------------------
[hostname]
ssh_only = false
format =  "[•$hostname](bg:1 bold fg:0)[](bold fg:1)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

# ---------------------------------------------------------------------------
# User
# ---------------------------------------------------------------------------
[username]
style_user = "bold bg:2 fg:0"
style_root = "1 bold"
format = "[](bold fg:0)[$user]($style)"
disabled = false
show_always = true

# ---------------------------------------------------------------------------
# Directories
# ---------------------------------------------------------------------------
[directory]
home_symbol = " "
read_only = "  "
style = "bg:4 fg:0"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:4)[󰉋 → $path]($style)[](bold fg:4)'

    [directory.substitutions]
    "Desktop" = "  "
    "Documents" = "  "
    "Downloads" = "  "
    "Music" = " 󰎈 "
    "Pictures" = "  "
    "Videos" = "  "
    "GitHub" = " 󰊤 "

# ---------------------------------------------------------------------------
# Command duration
# ---------------------------------------------------------------------------
[cmd_duration]
min_time = 0
format = '[  ](bold fg:3)[󰪢 $duration](bold bg:3 fg:0)[](bold fg:3)'

# ---------------------------------------------------------------------------
# Disabled modules
# ---------------------------------------------------------------------------
[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed 2"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

# >>> NOCTALIA STARSHIP PALETTE >>>
