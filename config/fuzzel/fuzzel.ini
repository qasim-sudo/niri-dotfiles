# fuzzel configuration — the application launcher behind Mod+D.
#
# Installed to ~/.config/fuzzel/fuzzel.ini
#
# The theme file is REGENERATED by Noctalia (fuzzel is in
# [theme.templates] community_ids), so the path below is a seed that Noctalia
# keeps in sync. @HOME@ is substituted by the installer at deploy time, so this
# file contains no absolute path to any particular account.

[main]
include=@HOME@/.config/fuzzel/themes/noctalia
