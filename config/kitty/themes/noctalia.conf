# kitty colour scheme — SEED.
#
# Deployed once by the installer, then owned by Noctalia. Noctalia rewrites this
# file whenever the wallpaper-derived palette changes, because "kitty" is listed
# in [theme.templates] builtin_ids in config/noctalia/config.toml.
#
# The values below are a neutral dark scheme so the very first terminal before
# Noctalia has run already looks intentional. You do not need to maintain it.

color0 #4d463b
color1 #ffb4ab
color2 #e2c28c
color3 #d5c4aa
color4 #c0cc9a
color5 #e2c28c
color6 #d5c4aa
color7 #e8e1db
color8 #998f82
color9 #ffb4ab
color10 #e2c28c
color11 #d5c4aa
color12 #c0cc9a
color13 #e2c28c
color14 #d5c4aa
color15 #e8e1db

cursor                #e8e1db
cursor_text_color     #000000
background            #000000
foreground            #e8e1db
selection_foreground  #d0c5b6
selection_background  #4d463b
active_border_color   #e2c28c
inactive_border_color #3f392e
url_color             #e2c28c

active_tab_foreground   #402d04
active_tab_background   #e2c28c
inactive_tab_foreground #d0c5b6
inactive_tab_background #3f392e
cursor_trail_color      #d0c5b6
