# kitty terminal configuration.
#
# This file is intentionally SHORT. kitty ships a fully documented reference
# config at:
#
#     /usr/share/doc/kitty/kitty.conf
#
# Every option you do not see below is left at its kitty default. Read the
# reference file for the full list; uncomment a line there if you need it.
#
# Load order: this file is read first, then `include themes/noctalia.conf` at
# the bottom pulls in the colour scheme. That theme file is REGENERATED by
# Noctalia whenever the wallpaper changes, so do not edit it here or in the
# repo — it is deployed as a seed and then owned by Noctalia.

# ---------------------------------------------------------------------------
# Appearance
# ---------------------------------------------------------------------------
# Slightly translucent so the blurred desktop shows through. niri blurs the
# kitty window itself (see cfg/appearance.kdl), so this is the only opacity
# control needed.
background_opacity 0.8

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
# Provided by ttf-jetbrains-mono-nerd, which is in packages/core.txt. The Nerd
# Font variant is required: the prompt, the Noctalia bar glyphs and every
# status-line icon in this desktop use Private Use Area codepoints.
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Map the entire Nerd Font PUA range onto the same family, so a fallback face
# can never render those glyphs as tofu.
symbol_map U+E000-U+F1AF0 JetBrainsMono Nerd Font Mono

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
# Seeded by this repository, then rewritten by Noctalia on every palette
# change (the palette is derived from the wallpaper).
include themes/noctalia.conf
