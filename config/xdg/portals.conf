# xdg-desktop-portal backend selection.
#
# Installed to: ~/.config/xdg-portal/portals.conf
#
# packages/core.txt installs exactly one portal backend,
# xdg-desktop-portal-gnome, so this file mostly states the intent explicitly
# and stops another package (or a stray Flatpak) from quietly registering a
# second backend for the niri session.
#
# Do NOT set an interface.* or UseIn= line for gtk or wlr here unless you have
# deliberately installed that backend. A UseIn line for a backend that is not
# installed leaves the portal half-configured.

[preferred]
default=gnome

[org.freedesktop.impl.portal.FileChooser]
UseIn=niri
Interfaces=gtk3;gtk4;

[org.freedesktop.impl.portal.Screenshot]
UseIn=niri
Interfaces=gnome;

[org.freedesktop.impl.portal.ScreenCast]
UseIn=niri
Interfaces=gnome;

[org.freedesktop.impl.portal.RemoteDesktop]
UseIn=niri
Interfaces=gnome;

[org.freedesktop.impl.portal.GlobalShortcuts]
UseIn=niri
Interfaces=gnome;
