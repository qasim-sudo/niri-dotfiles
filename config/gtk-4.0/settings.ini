# GTK 4.0 settings.
#
# Installed to ~/.config/gtk-4.0/settings.ini
#
# NO font-name KEY IS SET, deliberately. The UI font in force comes from
# Noctalia's [shell] font_family, which is "Adwaita Sans" — that is why
# adwaita-fonts is in packages/core.txt. If you would rather use a different
# UI font, add a line here, e.g.:
#     font-name=Inter 10
# and install the matching package from packages/optional.txt (inter-font).

[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
